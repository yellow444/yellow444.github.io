    <!-- Скрипты: загрузка контента, бургер + кнопка «Наверх» + модальное превью -->
    <script>
      // Загрузка контента статьи
      (function () {
        const params = new URLSearchParams(window.location.search);
        const content = params.get("content");
        if (content) {
          fetch(`${content}_content.html`)
            .then((response) => response.text())
            .then((html) => {
              document.getElementById("article-content").innerHTML = html;
            });
        }
      })();

      // Бургер-меню
      document.addEventListener("menuLoaded", () => {
        const toggle = document.getElementById("menuToggle");
        const nav = document.getElementById("mainNav");
        toggle.addEventListener("click", () => {
          const isOpen = nav.classList.toggle("open");
          toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
          document.body.classList.toggle("no-scroll-nav", isOpen);
        });
        // Закрывать меню по клику на ссылку
        nav.addEventListener("click", (e) => {
          if (e.target.tagName === "A" && nav.classList.contains("open")) {
            nav.classList.remove("open");
            toggle.setAttribute("aria-expanded", "false");
            document.body.classList.remove("no-scroll-nav");
          }
        });
      });

      // Плавающая кнопка «Наверх»
      (function () {
        const btn = document.getElementById("backToTopBtn");
        window.addEventListener("scroll", function () {
          btn.style.display = window.scrollY > 50 ? "block" : "none";
        });
        btn.style.display = "none";
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      })();

      // Модальное превью изображения
      (function () {
        const modal = document.getElementById("imgModal");
        const img = document.getElementById("previewImg");
        const modalImg = document.getElementById("modalImg");
        const closeBtn = document.getElementById("modalClose");

        function openModal() {
          modal.style.display = "block";
          modal.setAttribute("aria-hidden", "false");
          modalImg.src = img.src;
          document.body.classList.add("no-scroll"); // блокируем скролл фона
          closeBtn.focus();
        }
        function closeModal() {
          modal.style.display = "none";
          modal.setAttribute("aria-hidden", "true");
          document.body.classList.remove("no-scroll");
        }

        img.addEventListener("click", openModal);
        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", function (e) {
          if (e.target === modal) closeModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.style.display === "block")
            closeModal();
        });
      })();
    </script>
